# Keynote speakers.
# `abstract` and `bio` each take a list of paragraphs.
- speaker: "Sourav S. Bhowmick"
  honorific: "Prof."
  affiliation: "Nanyang Technological University, Singapore"
  url: "https://personal.ntu.edu.sg/assourav/"
  session_chair: "Prof. Makoto Onizuka"
  photo: /assets/images/dr_bhowmick.jpg
  title: "AI Agents for Democratizing Data Analysis: Are They Really the Silver Bullet?"
  abstract:
    - >-
      Agentic AI holds out the promise of simplifying many tasks, including data
      analysis, and providing us with superpower capabilities. In this keynote,
      we point out that getting reliable results and real value from data
      analysis requires more than just using AI agents out of the box. We end by
      suggesting some fruitful directions for research.
  bio:
    - >-
      Sourav S. Bhowmick is an Associate Professor in the College of Computing &
      Data Science (CCDS), Nanyang Technological University, Singapore. His
      research interests are in data management, human-data interaction, and
      data analytics. His research has appeared in premium venues such as ACM
      SIGMOD, VLDB, and VLDB Journal. He is co-recipient of Best Paper Awards in
      ACM CIKM 2004, ACM BCB 2011, VLDB 2021, and ER 2023. Sourav is serving as a
      member of the SIGMOD Executive Committee, SIGMOD Awards Committee, a
      regular member of the PVLDB advisory board, and an elected trustee of the
      VLDB Endowment.
    - >-
      He is a co-recipient of several service awards including VLDB Service
      Award in 2018; Distinguished AE Award in SIGMOD 2021, SIGMOD 2023, VLDB
      2022, VLDB 2026, and EDBT 2025; and Distinguished Reviewer Award in VLDB
      2020, VLDB 2023, and The VLDB Journal in 2026. He was inducted into
      Distinguished Members of the ACM in 2020.
    - "Sourav is a strong advocate of research that directly or indirectly impacts end users."
