---
layout: default
---

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
    <meta itemprop="headline" content="{{ page.title | escape_once }}">

    <div class="page__inner-wrap">
      {% include kjmd-pagehead.html %}

      <section class="page__content" itemprop="text">
        <style>
          .wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
            margin: 0;
            padding: 0;
            list-style: none;
          }
          .wall-item { margin: 0; }

          .wall-frame {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #f1f3f5;
            border-radius: 2px;
          }
          .wall-frame img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .4s cubic-bezier(.4, 0, .2, 1);
          }
          .wall-item:hover .wall-frame img { transform: scale(1.03); }

          /* The logo is artwork, not a photograph: show it whole. */
          .wall-item.is-logo .wall-frame {
            background: var(--paper);
            border: 1px solid var(--rule);
          }
          .wall-item.is-logo .wall-frame img {
            object-fit: contain;
            padding: 2rem;
          }
          .wall-item.is-logo:hover .wall-frame img { transform: none; }

          .wall-caption {
            display: block;
            margin-top: .7rem;
            color: var(--muted);
            font-size: .82rem;
            line-height: 1.5;
          }

          .wall-empty {
            margin: 0;
            padding: 4rem 0;
            border-top: 1px solid var(--rule);
            border-bottom: 1px solid var(--rule);
            text-align: center;
            color: var(--muted);
          }
        </style>

        {% if site.data.pictures and site.data.pictures.size > 0 %}
          <ul class="wall">
            {% for pic in site.data.pictures %}
              <li class="wall-item{% if forloop.first %} is-logo{% endif %}">
                <figure style="margin:0;">
                  <span class="wall-frame">
                    <img src="{{ pic.src | relative_url }}"
                         alt="{{ pic.alt | default: 'KJMD 2026' }}"
                         {% if forloop.first %}loading="eager"{% else %}loading="lazy"{% endif %}>
                  </span>
                  {% if pic.caption %}
                    <figcaption class="wall-caption">{{ pic.caption }}</figcaption>
                  {% endif %}
                </figure>
              </li>
            {% endfor %}
          </ul>
        {% else %}
          <p class="wall-empty">Photos will be posted here after the workshop.</p>
        {% endif %}
      </section>
    </div>
  </article>
</div>
