---
layout: default
---

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
    <meta itemprop="headline" content="{{ page.title | escape_once }}">

    <div class="page__inner-wrap">
      {% include kjmd-pagehead.html %}

      <section class="page__content" itemprop="text">
        <style>
          /* Two dinners set as parallel columns, divided by a rule rather
             than boxed. Each field is a labelled record. */
          .dinners {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            margin: 0;
            padding: 0;
            list-style: none;
            border-top: 1px solid var(--ink);
          }
          .dinner { padding: 2rem 0 2.5rem; }
          .dinner + .dinner {
            border-left: 1px solid var(--rule);
            padding-left: 2.5rem;
          }
          .dinner:first-child { padding-right: 2.5rem; }

          .dinner-day {
            margin: 0 0 1.75rem;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--ink);
          }
          .dinner-day .meal {
            display: block;
            margin-top: .3rem;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
          }

          .dinner dl { margin: 0; }
          .dinner dt {
            color: var(--muted);
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
          }
          .dinner dd {
            margin: .3rem 0 1.35rem;
            color: var(--ink);
            line-height: 1.6;
          }
          .dinner dd:last-child { margin-bottom: 0; }

          @media (max-width: 640px) {
            .dinners { grid-template-columns: 1fr; }
            .dinner:first-child { padding-right: 0; border-bottom: 1px solid var(--rule); }
            .dinner + .dinner { border-left: 0; padding-left: 0; }
          }
        </style>

        <ul class="dinners">
          <li class="dinner">
            <h2 class="dinner-day">10/30 (Fri) <span class="meal">Dinner</span></h2>
            <dl>
              <dt>Restaurant</dt><dd>To be announced</dd>
              <dt>When</dt><dd>To be announced</dd>
              <dt>Address</dt><dd>To be announced</dd>
            </dl>
          </li>

          <li class="dinner">
            <h2 class="dinner-day">10/31 (Sat) <span class="meal">Dinner</span></h2>
            <dl>
              <dt>Restaurant</dt><dd>To be announced</dd>
              <dt>When</dt><dd>To be announced</dd>
              <dt>Address</dt><dd>To be announced</dd>
            </dl>
          </li>
        </ul>
      </section>
    </div>
  </article>
</div>
