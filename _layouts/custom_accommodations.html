---
layout: default
---

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
    <meta itemprop="headline" content="{{ page.title | escape_once }}">

    <div class="page__inner-wrap">
      {% include kjmd-pagehead.html %}

      <section class="page__content" itemprop="text">
        <style>
          .place-name {
            margin: 0 0 .4rem;
            font-size: clamp(1.5rem, 2.8vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.15;
            color: var(--ink);
          }
          .place-native {
            margin: 0 0 2.5rem;
            color: var(--muted);
            font-size: .95rem;
          }

          .place-photo { margin: 0 0 3rem; }
          /* A wide crop rather than the full frame: the photo is context,
             not the subject of the page. */
          .place-photo img {
            width: 100%;
            height: auto;
            max-height: 320px;
            object-fit: cover;
            object-position: center;
            display: block;
            border-radius: 2px;
          }
          .place-photo .pending {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: 1.1rem 1.25rem;
            border: 1px dashed var(--rule);
            border-radius: 2px;
            color: var(--muted);
            font-size: .86rem;
          }
          .place-photo .pending i { opacity: .55; }

          .map {
            margin: 3rem 0 1.5rem;
            border: 1px solid var(--rule);
            border-radius: 2px;
            overflow: hidden;
          }
          .map .ratio { position: relative; padding-top: 52%; }
          .map iframe {
            position: absolute; inset: 0;
            width: 100%; height: 100%; border: 0;
          }

          .map-link {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding-bottom: .2rem;
            border-bottom: 1px solid var(--rule);
            color: var(--accent);
            font-size: .86rem;
            font-weight: 500;
            text-decoration: none;
            transition: border-color .15s ease;
          }
          .map-link:hover { border-bottom-color: var(--accent); }
          .map-link i { font-size: .72em; }
        </style>

        <h2 class="place-name">To be announced</h2>
        <p class="place-native">Hotel details will be posted here.</p>

        <figure class="place-photo">
          <div class="pending">
            <i class="fas fa-camera" aria-hidden="true"></i>
            <span>Hotel photo to be added</span>
          </div>
          <!--
          <img src="{{ '/assets/images/accommodation/hotel.jpg' | relative_url }}"
               alt="Conference hotel">
          -->
        </figure>

        <ul class="kjmd-records">
          <li class="kjmd-record">
            <span class="label">Address</span>
            <span class="value">To be announced</span>
          </li>
          <li class="kjmd-record">
            <span class="label">Getting there</span>
            <span class="value">To be announced</span>
          </li>
          <li class="kjmd-record">
            <span class="label">Tel</span>
            <span class="value">To be announced</span>
          </li>
          <li class="kjmd-record">
            <span class="label">Check-in / Check-out</span>
            <span class="value">To be announced</span>
          </li>
        </ul>
      </section>
    </div>
  </article>
</div>
