---
layout: default
---

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
    <meta itemprop="headline" content="{{ page.title | escape_once }}">

    <div class="page__inner-wrap">
      {% include kjmd-pagehead.html %}

      <section class="page__content" itemprop="text">
        <style>
          .tier { margin: 0 0 4rem; }
          .tier > h2 {
            margin: 0 0 2rem;
            padding-bottom: .85rem;
            border-bottom: 1px solid var(--ink);
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--ink);
          }

          .sponsor-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
            margin: 0;
            padding: 0;
            list-style: none;
          }
          .sponsor { margin: 0; }

          .sponsor-mark {
            display: flex;
            align-items: center;
            height: 84px;
            margin-bottom: 1.1rem;
          }
          .sponsor-mark img {
            max-width: 220px;
            max-height: 84px;
            width: auto; height: auto;
            object-fit: contain;
            display: block;
          }
          .sponsor-desc {
            margin: 0;
            max-width: 44ch;
            color: var(--muted);
            font-size: .92rem;
            line-height: 1.65;
          }
        </style>

        <section class="tier">
          <h2>Diamond Sponsors</h2>
          <ul class="sponsor-list">
            <li class="sponsor">
              <div class="sponsor-mark">
                <img src="{{ '/assets/images/hanguk_yeongu_jaedan.png' | relative_url }}"
                     alt="National Research Foundation of Korea">
              </div>
              <p class="sponsor-desc">
                National Research Foundation of Korea (NRF) &mdash; South Korea&rsquo;s
                government research-funding agency, supporting basic and applied
                research across all fields.
              </p>
            </li>
          </ul>
        </section>
      </section>
    </div>
  </article>
</div>
